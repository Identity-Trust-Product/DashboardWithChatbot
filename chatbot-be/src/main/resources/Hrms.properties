# ============================================================
# EMPLOYEE QUESTIONS
# ============================================================
Hrms.questions.How-many-employees-are-in-the-company=SELECT COUNT(*) FROM hrms.employees WHERE status = 'ACTIVE';
Hrms.questions.How-many-total-employees-are-registered=SELECT COUNT(*) FROM hrms.employees;
Hrms.questions.How-many-employees-are-on-probation=SELECT COUNT(*) FROM hrms.employees WHERE probation_end_date >= CURRENT_DATE AND status = 'ACTIVE';
Hrms.questions.How-many-employees-are-confirmed=SELECT COUNT(*) FROM hrms.employees WHERE (probation_end_date IS NULL OR probation_end_date < CURRENT_DATE) AND status = 'ACTIVE';
Hrms.questions.How-many-employees-are-inactive=SELECT COUNT(*) FROM hrms.employees WHERE status != 'ACTIVE';
Hrms.questions.How-many-male-employees-are-there=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(gender) = 'male' AND status = 'ACTIVE';
Hrms.questions.How-many-female-employees-are-there=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(gender) = 'female' AND status = 'ACTIVE';
Hrms.questions.List-all-active-employees=SELECT employee_code, first_name, last_name, designation, department_id, joining_date FROM hrms.employees WHERE status = 'ACTIVE' ORDER BY first_name;
Hrms.questions.List-all-employees-with-their-department=SELECT e.employee_code, e.first_name, e.last_name, e.designation, d.name AS department FROM hrms.employees e LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE e.status = 'ACTIVE' ORDER BY d.name, e.first_name;
Hrms.questions.Which-employees-are-on-probation=SELECT e.employee_code, e.first_name, e.last_name, e.designation, e.joining_date, e.probation_end_date, d.name AS department FROM hrms.employees e LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE e.probation_end_date >= CURRENT_DATE AND e.status = 'ACTIVE' ORDER BY e.probation_end_date;
Hrms.questions.Which-employees-joined-this-month=SELECT employee_code, first_name, last_name, designation, joining_date FROM hrms.employees WHERE EXTRACT(MONTH FROM joining_date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM joining_date) = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY joining_date;
Hrms.questions.Which-employees-joined-this-year=SELECT employee_code, first_name, last_name, designation, joining_date FROM hrms.employees WHERE EXTRACT(YEAR FROM joining_date) = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY joining_date;
Hrms.questions.How-many-employees-joined-each-year=SELECT EXTRACT(YEAR FROM joining_date)::int AS year, COUNT(*) AS total FROM hrms.employees WHERE joining_date IS NOT NULL GROUP BY year ORDER BY year;
Hrms.questions.How-many-employees-are-in-each-department=SELECT d.name AS department, COUNT(e.id) AS total_employees FROM hrms.departments d LEFT JOIN hrms.employees e ON e.department_id = d.id AND e.status = 'ACTIVE' GROUP BY d.name ORDER BY total_employees DESC;
Hrms.questions.How-many-employees-are-full-time=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(employment_type) = 'full-time' AND status = 'ACTIVE';
Hrms.questions.How-many-employees-are-part-time=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(employment_type) = 'part-time' AND status = 'ACTIVE';
Hrms.questions.How-many-employees-are-contract=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(employment_type) = 'contract' AND status = 'ACTIVE';
Hrms.questions.How-many-employees-are-in-each-employment-type=SELECT COALESCE(employment_type, 'Unspecified') AS employment_type, COUNT(*) AS total FROM hrms.employees WHERE status = 'ACTIVE' GROUP BY employment_type ORDER BY total DESC;
Hrms.questions.What-is-the-average-salary-of-employees=SELECT ROUND(AVG(basic_salary), 2) AS average_salary FROM hrms.employees WHERE status = 'ACTIVE';
Hrms.questions.What-is-the-highest-salary-in-the-company=SELECT MAX(basic_salary) AS highest_salary FROM hrms.employees WHERE status = 'ACTIVE';
Hrms.questions.What-is-the-lowest-salary-in-the-company=SELECT MIN(basic_salary) AS lowest_salary FROM hrms.employees WHERE status = 'ACTIVE';
Hrms.questions.What-is-the-total-salary-cost-of-the-company=SELECT SUM(basic_salary) AS total_salary_cost FROM hrms.employees WHERE status = 'ACTIVE';
Hrms.questions.Which-employees-have-the-highest-salary=SELECT e.employee_code, e.first_name, e.last_name, e.designation, e.basic_salary, d.name AS department FROM hrms.employees e LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE e.status = 'ACTIVE' ORDER BY e.basic_salary DESC LIMIT 10;
Hrms.questions.List-employees-by-work-location=SELECT work_location, COUNT(*) AS total FROM hrms.employees WHERE status = 'ACTIVE' AND work_location IS NOT NULL GROUP BY work_location ORDER BY total DESC;
Hrms.questions.List-employees-who-are-married=SELECT COUNT(*) FROM hrms.employees WHERE LOWER(marital_status) = 'married' AND status = 'ACTIVE';
Hrms.questions.How-many-employees-have-no-reporting-manager=SELECT COUNT(*) FROM hrms.employees WHERE reporting_manager_id IS NULL AND status = 'ACTIVE';

# ============================================================
# DEPARTMENT QUESTIONS
# ============================================================
Hrms.questions.How-many-departments-are-there=SELECT COUNT(*) FROM hrms.departments;
Hrms.questions.List-all-departments=SELECT name, description, created_at FROM hrms.departments ORDER BY name;
Hrms.questions.Which-department-has-the-most-employees=SELECT d.name AS department, COUNT(e.id) AS total FROM hrms.departments d JOIN hrms.employees e ON e.department_id = d.id AND e.status = 'ACTIVE' GROUP BY d.name ORDER BY total DESC LIMIT 1;
Hrms.questions.Which-department-has-the-least-employees=SELECT d.name AS department, COUNT(e.id) AS total FROM hrms.departments d LEFT JOIN hrms.employees e ON e.department_id = d.id AND e.status = 'ACTIVE' GROUP BY d.name ORDER BY total ASC LIMIT 1;
Hrms.questions.What-is-the-average-salary-per-department=SELECT d.name AS department, ROUND(AVG(e.basic_salary), 2) AS avg_salary FROM hrms.departments d JOIN hrms.employees e ON e.department_id = d.id AND e.status = 'ACTIVE' GROUP BY d.name ORDER BY avg_salary DESC;

# ============================================================
# ATTENDANCE QUESTIONS
# ============================================================
Hrms.questions.How-many-employees-are-present-today=SELECT COUNT(*) FROM hrms.attendance WHERE date = CURRENT_DATE AND status = 'PRESENT';
Hrms.questions.How-many-employees-are-absent-today=SELECT COUNT(*) FROM hrms.attendance WHERE date = CURRENT_DATE AND status = 'ABSENT';
Hrms.questions.What-is-the-attendance-rate-today=SELECT ROUND(COUNT(CASE WHEN status = 'PRESENT' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS attendance_rate_percent FROM hrms.attendance WHERE date = CURRENT_DATE;
Hrms.questions.List-employees-present-today=SELECT e.employee_code, e.first_name, e.last_name, a.check_in, a.check_out, a.total_hours, d.name AS department FROM hrms.attendance a JOIN hrms.employees e ON a.employee_id = e.id LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE a.date = CURRENT_DATE AND a.status = 'PRESENT' ORDER BY e.first_name;
Hrms.questions.List-employees-absent-today=SELECT e.employee_code, e.first_name, e.last_name, d.name AS department FROM hrms.attendance a JOIN hrms.employees e ON a.employee_id = e.id LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE a.date = CURRENT_DATE AND a.status = 'ABSENT' ORDER BY e.first_name;
Hrms.questions.What-is-the-average-working-hours-this-month=SELECT ROUND(AVG(total_hours), 2) AS avg_working_hours FROM hrms.attendance WHERE EXTRACT(MONTH FROM date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM date) = EXTRACT(YEAR FROM CURRENT_DATE) AND total_hours IS NOT NULL;
Hrms.questions.Which-employee-worked-the-most-hours-this-month=SELECT e.employee_code, e.first_name, e.last_name, SUM(a.total_hours) AS total_hours FROM hrms.attendance a JOIN hrms.employees e ON a.employee_id = e.id WHERE EXTRACT(MONTH FROM a.date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM a.date) = EXTRACT(YEAR FROM CURRENT_DATE) GROUP BY e.employee_code, e.first_name, e.last_name ORDER BY total_hours DESC LIMIT 5;
Hrms.questions.What-is-the-monthly-attendance-trend=SELECT TO_CHAR(date, 'Mon YYYY') AS month, COUNT(CASE WHEN status='PRESENT' THEN 1 END) AS present, COUNT(CASE WHEN status='ABSENT' THEN 1 END) AS absent FROM hrms.attendance WHERE date >= CURRENT_DATE - INTERVAL '6 months' GROUP BY TO_CHAR(date, 'Mon YYYY'), DATE_TRUNC('month', date) ORDER BY DATE_TRUNC('month', date);
Hrms.questions.How-many-late-check-ins-happened-today=SELECT COUNT(*) FROM hrms.attendance WHERE date = CURRENT_DATE AND check_in > (CURRENT_DATE + TIME '09:30:00');
Hrms.questions.Which-employees-have-not-checked-out-today=SELECT e.employee_code, e.first_name, e.last_name, a.check_in FROM hrms.attendance a JOIN hrms.employees e ON a.employee_id = e.id WHERE a.date = CURRENT_DATE AND a.check_in IS NOT NULL AND a.check_out IS NULL ORDER BY e.first_name;
Hrms.questions.What-is-the-attendance-rate-this-month=SELECT ROUND(COUNT(CASE WHEN status = 'PRESENT' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS attendance_rate_percent FROM hrms.attendance WHERE EXTRACT(MONTH FROM date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM date) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.List-employees-with-perfect-attendance-this-month=SELECT e.employee_code, e.first_name, e.last_name, COUNT(*) AS days_present FROM hrms.attendance a JOIN hrms.employees e ON a.employee_id = e.id WHERE a.status = 'PRESENT' AND EXTRACT(MONTH FROM a.date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM a.date) = EXTRACT(YEAR FROM CURRENT_DATE) GROUP BY e.employee_code, e.first_name, e.last_name ORDER BY days_present DESC;

# ============================================================
# LEAVE QUESTIONS
# ============================================================
Hrms.questions.How-many-leave-requests-are-pending=SELECT COUNT(*) FROM hrms.leaves WHERE status = 'PENDING';
Hrms.questions.How-many-employees-are-on-leave-today=SELECT COUNT(DISTINCT employee_id) FROM hrms.leaves WHERE CURRENT_DATE BETWEEN start_date AND end_date AND status = 'APPROVED';
Hrms.questions.List-employees-on-leave-today=SELECT e.employee_code, e.first_name, e.last_name, l.leave_type, l.start_date, l.end_date, d.name AS department FROM hrms.leaves l JOIN hrms.employees e ON l.employee_id = e.id LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE CURRENT_DATE BETWEEN l.start_date AND l.end_date AND l.status = 'APPROVED' ORDER BY e.first_name;
Hrms.questions.List-all-pending-leave-requests=SELECT e.employee_code, e.first_name, e.last_name, l.leave_type, l.start_date, l.end_date, l.total_days, l.reason FROM hrms.leaves l JOIN hrms.employees e ON l.employee_id = e.id WHERE l.status = 'PENDING' ORDER BY l.created_at;
Hrms.questions.How-many-leaves-were-approved-this-month=SELECT COUNT(*) FROM hrms.leaves WHERE status = 'APPROVED' AND EXTRACT(MONTH FROM start_date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM start_date) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.How-many-leaves-were-rejected-this-month=SELECT COUNT(*) FROM hrms.leaves WHERE status = 'REJECTED' AND EXTRACT(MONTH FROM start_date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM start_date) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-leave-approval-rate=SELECT ROUND(COUNT(CASE WHEN status = 'APPROVED' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS approval_rate_percent FROM hrms.leaves;
Hrms.questions.Which-leave-type-is-most-used=SELECT COALESCE(leave_type, 'Unspecified') AS leave_type, COUNT(*) AS total FROM hrms.leaves GROUP BY leave_type ORDER BY total DESC;
Hrms.questions.How-many-leave-days-were-taken-this-month=SELECT SUM(total_days) AS total_leave_days FROM hrms.leaves WHERE status = 'APPROVED' AND EXTRACT(MONTH FROM start_date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM start_date) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.Which-employee-took-the-most-leaves-this-year=SELECT e.employee_code, e.first_name, e.last_name, SUM(l.total_days) AS total_days FROM hrms.leaves l JOIN hrms.employees e ON l.employee_id = e.id WHERE l.status = 'APPROVED' AND EXTRACT(YEAR FROM l.start_date) = EXTRACT(YEAR FROM CURRENT_DATE) GROUP BY e.employee_code, e.first_name, e.last_name ORDER BY total_days DESC LIMIT 10;
Hrms.questions.How-many-sick-leaves-were-taken-this-year=SELECT COUNT(*) AS total_requests, SUM(total_days) AS total_days FROM hrms.leaves WHERE LOWER(leave_type) LIKE '%sick%' AND status = 'APPROVED' AND EXTRACT(YEAR FROM start_date) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.List-upcoming-leaves-in-next-7-days=SELECT e.employee_code, e.first_name, e.last_name, l.leave_type, l.start_date, l.end_date, l.total_days FROM hrms.leaves l JOIN hrms.employees e ON l.employee_id = e.id WHERE l.status = 'APPROVED' AND l.start_date BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL '7 days' ORDER BY l.start_date;

# ============================================================
# PAYROLL QUESTIONS
# ============================================================
Hrms.questions.How-many-payroll-records-are-pending=SELECT COUNT(*) FROM hrms.payroll WHERE payment_status = 'PENDING';
Hrms.questions.What-is-the-total-payroll-cost-this-month=SELECT SUM(net_salary) AS total_payroll FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-total-payroll-cost-this-year=SELECT SUM(net_salary) AS total_payroll FROM hrms.payroll WHERE year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-average-net-salary=SELECT ROUND(AVG(net_salary), 2) AS average_net_salary FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-payroll-processed-rate=SELECT ROUND(COUNT(CASE WHEN payment_status = 'PAID' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2) AS processed_rate_percent FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.List-employees-whose-salary-is-not-processed-this-month=SELECT e.employee_code, e.first_name, e.last_name, p.gross_salary, p.payment_status FROM hrms.payroll p JOIN hrms.employees e ON p.employee_id = e.id WHERE p.payment_status = 'PENDING' AND p.month = EXTRACT(MONTH FROM CURRENT_DATE) AND p.year = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY e.first_name;
Hrms.questions.What-is-the-monthly-payroll-trend-for-last-6-months=SELECT year::text || '-' || LPAD(month::text,2,'0') AS period, SUM(net_salary) AS total_payroll FROM hrms.payroll GROUP BY year, month ORDER BY year DESC, month DESC LIMIT 6;
Hrms.questions.What-is-the-total-tax-deducted-this-month=SELECT SUM(tax_deduction) AS total_tax FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-total-PF-deducted-this-month=SELECT SUM(pf_deduction) AS total_pf FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.Which-employee-received-the-highest-salary-this-month=SELECT e.employee_code, e.first_name, e.last_name, p.net_salary, p.gross_salary FROM hrms.payroll p JOIN hrms.employees e ON p.employee_id = e.id WHERE p.month = EXTRACT(MONTH FROM CURRENT_DATE) AND p.year = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY p.net_salary DESC LIMIT 5;
Hrms.questions.What-is-the-total-bonus-paid-this-year=SELECT SUM(bonus) AS total_bonus FROM hrms.payroll WHERE year = EXTRACT(YEAR FROM CURRENT_DATE) AND bonus IS NOT NULL;
Hrms.questions.What-is-the-total-overtime-paid-this-month=SELECT SUM(overtime_pay) AS total_overtime FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-average-HRA-this-month=SELECT ROUND(AVG(hra), 2) AS average_hra FROM hrms.payroll WHERE month = EXTRACT(MONTH FROM CURRENT_DATE) AND year = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-department-wise-payroll-cost-this-month=SELECT d.name AS department, SUM(p.net_salary) AS total_payroll FROM hrms.payroll p JOIN hrms.employees e ON p.employee_id = e.id JOIN hrms.departments d ON e.department_id = d.id WHERE p.month = EXTRACT(MONTH FROM CURRENT_DATE) AND p.year = EXTRACT(YEAR FROM CURRENT_DATE) GROUP BY d.name ORDER BY total_payroll DESC;

# ============================================================
# PERFORMANCE QUESTIONS
# ============================================================
Hrms.questions.What-is-the-average-performance-rating=SELECT ROUND(AVG(rating), 2) AS avg_rating FROM hrms.performance WHERE rating IS NOT NULL;
Hrms.questions.Which-employees-have-the-highest-performance-rating=SELECT e.employee_code, e.first_name, e.last_name, p.rating, p.review_period, d.name AS department FROM hrms.performance p JOIN hrms.employees e ON p.employee_id = e.id LEFT JOIN hrms.departments d ON e.department_id = d.id ORDER BY p.rating DESC LIMIT 10;
Hrms.questions.Which-employees-have-the-lowest-performance-rating=SELECT e.employee_code, e.first_name, e.last_name, p.rating, p.review_period FROM hrms.performance p JOIN hrms.employees e ON p.employee_id = e.id WHERE p.rating IS NOT NULL ORDER BY p.rating ASC LIMIT 10;
Hrms.questions.How-many-performance-reviews-were-done-this-year=SELECT COUNT(*) FROM hrms.performance WHERE EXTRACT(YEAR FROM created_at) = EXTRACT(YEAR FROM CURRENT_DATE);
Hrms.questions.What-is-the-department-wise-average-performance-rating=SELECT d.name AS department, ROUND(AVG(p.rating), 2) AS avg_rating FROM hrms.performance p JOIN hrms.employees e ON p.employee_id = e.id JOIN hrms.departments d ON e.department_id = d.id GROUP BY d.name ORDER BY avg_rating DESC;
Hrms.questions.Which-employees-have-not-been-reviewed-yet=SELECT e.employee_code, e.first_name, e.last_name, e.designation, d.name AS department FROM hrms.employees e LEFT JOIN hrms.departments d ON e.department_id = d.id WHERE e.id NOT IN (SELECT DISTINCT employee_id FROM hrms.performance) AND e.status = 'ACTIVE' ORDER BY e.first_name;
Hrms.questions.List-all-performance-reviews=SELECT e.employee_code, e.first_name, e.last_name, p.review_period, p.rating, p.feedback, d.name AS department FROM hrms.performance p JOIN hrms.employees e ON p.employee_id = e.id LEFT JOIN hrms.departments d ON e.department_id = d.id ORDER BY p.created_at DESC;

# ============================================================
# PROJECT QUESTIONS
# ============================================================
Hrms.questions.How-many-active-projects-are-there=SELECT COUNT(*) FROM hrms.projects WHERE end_date >= CURRENT_DATE OR end_date IS NULL;
Hrms.questions.How-many-total-projects-are-there=SELECT COUNT(*) FROM hrms.projects;
Hrms.questions.List-all-active-projects=SELECT p.name, p.description, p.start_date, p.end_date, COUNT(pa.employee_id) AS team_size FROM hrms.projects p LEFT JOIN hrms.project_assignments pa ON pa.project_id = p.id WHERE p.end_date >= CURRENT_DATE OR p.end_date IS NULL GROUP BY p.id ORDER BY p.start_date DESC;
Hrms.questions.Which-project-has-the-most-employees=SELECT p.name AS project, COUNT(pa.employee_id) AS team_size FROM hrms.projects p JOIN hrms.project_assignments pa ON pa.project_id = p.id GROUP BY p.name ORDER BY team_size DESC LIMIT 5;
Hrms.questions.List-all-employees-assigned-to-projects=SELECT e.employee_code, e.first_name, e.last_name, p.name AS project, pa.role, pa.assigned_date FROM hrms.project_assignments pa JOIN hrms.employees e ON pa.employee_id = e.id JOIN hrms.projects p ON pa.project_id = p.id ORDER BY p.name, e.first_name;
Hrms.questions.Which-projects-are-ending-this-month=SELECT name, description, start_date, end_date FROM hrms.projects WHERE EXTRACT(MONTH FROM end_date) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM end_date) = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY end_date;
Hrms.questions.How-many-employees-are-not-assigned-to-any-project=SELECT COUNT(*) FROM hrms.employees WHERE id NOT IN (SELECT DISTINCT employee_id FROM hrms.project_assignments) AND status = 'ACTIVE';
Hrms.questions.Which-employees-are-working-on-multiple-projects=SELECT e.employee_code, e.first_name, e.last_name, COUNT(pa.project_id) AS project_count FROM hrms.project_assignments pa JOIN hrms.employees e ON pa.employee_id = e.id GROUP BY e.employee_code, e.first_name, e.last_name HAVING COUNT(pa.project_id) > 1 ORDER BY project_count DESC;

# ============================================================
# USER & ROLE QUESTIONS
# ============================================================
Hrms.questions.How-many-users-are-active-in-the-system=SELECT COUNT(*) FROM hrms.users WHERE is_active = true;
Hrms.questions.How-many-users-are-there-in-each-role=SELECT r.name AS role, COUNT(u.id) AS total FROM hrms.roles r LEFT JOIN hrms.users u ON u.role_id = r.id GROUP BY r.name ORDER BY total DESC;
Hrms.questions.How-many-admin-users-are-there=SELECT COUNT(*) FROM hrms.users u JOIN hrms.roles r ON u.role_id = r.id WHERE LOWER(r.name) = 'admin' AND u.is_active = true;
Hrms.questions.List-all-roles-in-the-system=SELECT name, description FROM hrms.roles ORDER BY name;
Hrms.questions.Which-users-were-created-this-month=SELECT username, email, created_at FROM hrms.users WHERE EXTRACT(MONTH FROM created_at) = EXTRACT(MONTH FROM CURRENT_DATE) AND EXTRACT(YEAR FROM created_at) = EXTRACT(YEAR FROM CURRENT_DATE) ORDER BY created_at DESC;