<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome - EDP Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: 'Nunito', sans-serif;
            background:
                linear-gradient(120deg, rgba(18, 25, 38, 0.82), rgba(26, 58, 95, 0.74)),
                url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 24px;
        }
        main {
            width: min(720px, 100%);
            text-align: center;
        }
        .mark {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(8px);
            font-size: 28px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(34px, 7vw, 64px);
            line-height: 1;
            font-weight: 900;
        }
        p {
            width: min(560px, 100%);
            margin: 0 auto 30px;
            color: rgba(255, 255, 255, 0.86);
            font-size: 18px;
            font-weight: 700;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .action-link {
            min-width: 156px;
            min-height: 48px;
            border: 0;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font: inherit;
            font-weight: 900;
            text-decoration: none;
        }
        .primary { background: #ffffff; color: #183153; }
        .secondary {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.42);
        }
    </style>
</head>
<body>
<main>
    <div class="mark"><i class="fas fa-layer-group"></i></div>
    <h1>EDP Portal</h1>
    <p>Access your dashboard through Identity OS.</p>
    <div class="actions">
        <a class="action-link primary" th:href="${identityLoginUrl}">
            <i class="fas fa-right-to-bracket"></i>
            Login
        </a>
        <a class="action-link secondary" th:href="${identityRegisterUrl}">
            <i class="fas fa-user-plus"></i>
            Register
        </a>
    </div>
</main>
</body>
</html>
