<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error - EDP</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1a1f36 0%, #2e3563 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: white;
            border-radius: 22px;
            padding: 52px 44px 44px;
            text-align: center;
            max-width: 480px;
            width: 92%;
            box-shadow: 0 24px 70px rgba(0,0,0,0.32);
        }
        .error-icon {
            width: 84px; height: 84px;
            background: linear-gradient(135deg, #e74a3b, #c0392b);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 22px;
            font-size: 38px;
            color: white;
            box-shadow: 0 8px 24px rgba(231,74,59,0.4);
        }
        .error-code {
            font-size: 78px;
            font-weight: 900;
            background: linear-gradient(135deg, #4e73df, #6610f2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 800;
            color: #1a1f36;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 14px;
            color: #718096;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .error-detail {
            background: #f8f9fc;
            border: 1px solid #e3e6f0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 13px;
            color: #444;
            margin-bottom: 28px;
            text-align: left;
            border-left: 4px solid #e74a3b;
        }
        .error-detail span { font-weight: 800; color: #e74a3b; }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #4e73df, #224abe);
            color: white;
            padding: 13px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(78,115,223,0.4);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(78,115,223,0.5);
            color: white;
            text-decoration: none;
        }
        .breadcrumb-trail {
            font-size: 12px;
            color: #aaa;
            margin-top: 22px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <div class="error-code" th:text="${status != null ? status : '500'}">500</div>
        <div class="error-title">Oops! Something went wrong</div>

        <p class="error-desc">
            We encountered an unexpected error while processing your request.
            Please try again or contact support if the problem persists.
        </p>

        <div class="error-detail" th:if="${message != null}">
            <span>Error: </span>
            <span th:text="${message}">An unexpected error occurred.</span>
        </div>
        <div class="error-detail" th:unless="${message != null}">
            <span>Info: </span>An internal server error occurred. Please try again.
        </div>

        <a href="/" class="btn-home">
            <i class="fas fa-home"></i> Back to Home
        </a>

        <div class="breadcrumb-trail">
            EDP Portal &nbsp;&bull;&nbsp; <span th:text="${status != null ? 'Error ' + status : 'Server Error'}">Server Error</span>
        </div>
    </div>
</body>
</html>
