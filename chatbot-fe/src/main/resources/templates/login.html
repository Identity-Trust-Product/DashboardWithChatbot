<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - EDP Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: 'Nunito', sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        .panel {
            width: min(420px, calc(100vw - 32px));
            padding: 34px;
            border: 1px solid #d9e2ef;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.12);
            text-align: center;
        }
        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #e8f1ff;
            color: #2f6bff;
            font-size: 24px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; font-weight: 900; }
        p { margin: 0 0 22px; color: #667085; font-weight: 700; }
        .alert {
            margin-bottom: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #edf7ed;
            border: 1px solid #b7dfb9;
            color: #1f6f2a;
            font-size: 14px;
            font-weight: 700;
        }
        .alert-error {
            background: #fff0f0;
            border-color: #f2b8b8;
            color: #8a1f1f;
        }
        a.button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            min-height: 46px;
            padding: 12px 18px;
            border-radius: 8px;
            background: #2f6bff;
            color: white;
            text-decoration: none;
            font-weight: 900;
        }
    </style>
</head>
<body>
<main class="panel">
    <div class="icon"><i class="fas fa-right-to-bracket"></i></div>
    <h1>Redirecting to Identity OS</h1>
    <p>Continue login with your Identity OS account.</p>

    <div class="alert alert-error" th:if="${errorMsg}">
        <span th:text="${errorMsg}"></span>
    </div>
    <div class="alert" th:if="${logoutMsg}">
        <span th:text="${logoutMsg}"></span>
    </div>

    <a class="button" th:href="${identityLoginUrl}">
        <i class="fas fa-right-to-bracket"></i>
        Login
    </a>
</main>
</body>
</html>
