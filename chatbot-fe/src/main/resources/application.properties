# =============================================
#  EDP Portal - Application Properties
# =============================================

server.port=9091
spring.application.name=chatbot-fe

# ---- Identity OS test integration ----
identity.os.base-url=http://localhost:3000
identity.os.client-id=app_b713e8eeab81
identity.os.redirect-uri=http://localhost:9091/callback
identity.os.login-path=/identity/login
identity.os.register-path=/identity/register

# ---- Thymeleaf ----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ---- Disable Security auto-config if you have NO SecurityConfig.java ----
# (Comment these two lines out if you ARE using SecurityConfig.java)
# spring.autoconfigure.exclude=\
#   org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
#   org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---- If you want quick dev login without a SecurityConfig ----
# spring.security.user.name=admin
# spring.security.user.password=admin123

# ---- Logging (set DEBUG to see Thymeleaf template errors clearly) ----
logging.level.org.thymeleaf=DEBUG
logging.level.nz.net.ultraq=DEBUG
logging.level.root=INFO

# =============================================
#  DB COLUMN NAME MAPPING
#  If your database renames a column:
#    1. Change the value here ONLY
#    2. Controller, Service, and UI stay unchanged
# =============================================

# Employee table
col.emp.empNo=empNo
col.emp.alias=empAlias
col.emp.officeId=officeId
col.emp.doj=doj
col.emp.retDt=expectedRetDt
col.emp.rank=rankId
col.emp.type=empTypeDesc
col.emp.blood=bloodGrp
col.emp.dob=dob

# Ocf table
col.ocf.typeId=typeOfFileId

# Leave table
col.leave.status=status

# Module table
col.module.name=moduleName

# UserDashboardConfiguration table
col.userconfig.dashboardData=dashboardData
col.userconfig.todoList=todoList
col.userconfig.queryPref=queryPreference

