# =============================================
#  EDP Portal - Application Properties
# =============================================
 
server.port=9091
spring.application.name=chatbot-fe
 
# ---- Thymeleaf ----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
 
# ---- Disable Security auto-config if you have NO SecurityConfig.java ----
# (Comment these two lines out if you ARE using SecurityConfig.java)
# spring.autoconfigure.exclude=\
#   org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
#   org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
 
# ---- If you want quick dev login without a SecurityConfig ----
# spring.security.user.name=admin
# spring.security.user.password=admin123
 
# ---- Logging (set DEBUG to see Thymeleaf template errors clearly) ----
logging.level.org.thymeleaf=DEBUG
logging.level.nz.net.ultraq=DEBUG
logging.level.root=INFO